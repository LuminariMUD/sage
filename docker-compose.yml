services:
  # PostgreSQL with pgvector for documents and embeddings
  postgres:
    # PG18: the official image stores data under a major-version subdirectory, so the
    # volume mounts at /var/lib/postgresql (NOT /var/lib/postgresql/data) below.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18}
    container_name: luminari-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luminari}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env file}"
      POSTGRES_DB: ${POSTGRES_DB:-luminari_sage}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432" # Local development only
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./schemas/postgresql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-luminari} -d ${POSTGRES_DB:-luminari_sage}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminari-network
    restart: "no"

  # Neo4j for graph database
  neo4j:
    # Migrated from 5.26 to the 2026.06 calver line (store format record-aligned-1.1).
    image: ${NEO4J_IMAGE:-neo4j:2026.06.0-community}
    container_name: luminari-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env file}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474" # Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Schema file mount temporarily removed - Neo4j tries to chown it with :ro flag
      # - ./schemas/neo4j_schema.cypher:/var/lib/neo4j/import/schema.cypher:ro
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminari-network
    restart: "no"

  # Ollama for local LLM inference with GPU support
  ollama:
    image: ollama/ollama:latest
    container_name: luminari-ollama
    ports:
      # Host port is configurable to avoid clashing with another Ollama on the host;
      # in-cluster clients reach this service at http://ollama:11434 regardless.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - luminari-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # GPU Configuration
      OLLAMA_NUM_GPU: "1" # Single GPU
      OLLAMA_GPU_MEMORY_FRACTION: "0.8" # Use 80% of 8GB VRAM (~6.4GB)
      OLLAMA_NUM_PARALLEL: "2" # Two inference slots fit alongside the 7B model
      # Keep the 7B chat model and the small embedding model resident together.
      # This avoids reloading ~5 GB several times for every Graphiti episode.
      OLLAMA_MAX_LOADED_MODELS: "2"

      # Timeout & Keep-Alive
      OLLAMA_LOAD_TIMEOUT: "10m" # Model load timeout (default 5m)
      OLLAMA_KEEP_ALIVE: "10m" # Keep model in VRAM after request

      # Context Management
      # Ollama 0.12+ reads OLLAMA_CONTEXT_LENGTH at server startup. OLLAMA_NUM_CTX
      # is a per-request option and was silently ignored here, leaving Graphiti at
      # the 4096-token default even when the API requested a larger context.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_MAX_CONTEXT_TOKENS:-12288}
      OLLAMA_NUM_THREAD: "8" # Half of 16 CPU cores

      # Performance Tuning
      OLLAMA_FLASH_ATTENTION: "true" # Enable Flash Attention (faster)
      OLLAMA_KV_CACHE_TYPE: "f16" # Use FP16 for KV cache (saves VRAM)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  # Pull every model required by the local profile before the API starts. This
  # is idempotent: an existing model is verified rather than downloaded again.
  ollama-init:
    image: ollama/ollama:latest
    container_name: luminari-ollama-init
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama_model_profile.sh", "pull"]
    command: []
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      TEXT_PROVIDER: ${TEXT_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      USE_LOCAL_EMBEDDINGS: ${USE_LOCAL_EMBEDDINGS:-true}
      GRAPHITI_PROVIDER: ${GRAPHITI_PROVIDER:-}
      GRAPHITI_TEXT_PROVIDER: ${GRAPHITI_TEXT_PROVIDER:-}
      GRAPHITI_EMBEDDING_PROVIDER: ${GRAPHITI_EMBEDDING_PROVIDER:-}
      GRAPHITI_TEXT_MODEL: ${GRAPHITI_TEXT_MODEL:-}
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-}
      GRAPHITI_EXTRACTION_FALLBACK_PROVIDER: ${GRAPHITI_EXTRACTION_FALLBACK_PROVIDER:-}
      GRAPHITI_EXTRACTION_FALLBACK_MODEL: ${GRAPHITI_EXTRACTION_FALLBACK_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CREATIVE_MODEL: ${OLLAMA_CREATIVE_MODEL:-${OLLAMA_CHAT_MODEL:-qwen2.5:7b}}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-qwen2.5:3b}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EXTRACTION_MODEL: ${OLLAMA_EXTRACTION_MODEL:-${OLLAMA_CHAT_MODEL:-qwen2.5:7b}}
      OLLAMA_TOOLS_MODEL: ${OLLAMA_TOOLS_MODEL:-${OLLAMA_CHAT_MODEL:-qwen2.5:7b}}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - luminari-network
    volumes:
      - ./scripts/ollama_model_profile.sh:/usr/local/bin/ollama_model_profile.sh:ro
    restart: "no"

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: luminari-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-luminari}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env file}"
      POSTGRES_DB: ${POSTGRES_DB:-luminari_sage}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env file}"
      API_HOST: 0.0.0.0
      API_PORT: 8003
      API_RELOAD: ${API_RELOAD:-true}
      LORE_DIR: /app/lore_docs
      # LLM Provider Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      TEXT_PROVIDER: ${TEXT_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_CREATIVE_MODEL: ${OLLAMA_CREATIVE_MODEL:-qwen2.5:7b}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-qwen2.5:3b}
      OLLAMA_EXTRACTION_MODEL: ${OLLAMA_EXTRACTION_MODEL:-${OLLAMA_CHAT_MODEL:-qwen2.5:7b}}
      # Tool-calling agents need a tool-capable model (deepseek-r1 cannot call tools)
      OLLAMA_TOOLS_MODEL: ${OLLAMA_TOOLS_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      OLLAMA_EMBEDDING_BATCH_SIZE: ${OLLAMA_EMBEDDING_BATCH_SIZE:-32}
      OLLAMA_MAX_CONTEXT_TOKENS: ${OLLAMA_MAX_CONTEXT_TOKENS:-12288}
      GRAPHITI_PROVIDER: ${GRAPHITI_PROVIDER:-}
      GRAPHITI_TEXT_PROVIDER: ${GRAPHITI_TEXT_PROVIDER:-}
      GRAPHITI_EMBEDDING_PROVIDER: ${GRAPHITI_EMBEDDING_PROVIDER:-}
      GRAPHITI_TEXT_MODEL: ${GRAPHITI_TEXT_MODEL:-}
      GRAPHITI_TEXT_MODEL_REVISION: ${GRAPHITI_TEXT_MODEL_REVISION:-}
      GRAPHITI_EMBEDDING_MODEL_REVISION: ${GRAPHITI_EMBEDDING_MODEL_REVISION:-}
      GRAPHITI_REQUEST_TIMEOUT: ${GRAPHITI_REQUEST_TIMEOUT:-600}
      GRAPHITI_MAX_OUTPUT_TOKENS: ${GRAPHITI_MAX_OUTPUT_TOKENS:-4096}
      GRAPHITI_MAX_ENTITIES_PER_EPISODE: ${GRAPHITI_MAX_ENTITIES_PER_EPISODE:-25}
      GRAPHITI_MAX_RELATIONSHIPS_PER_EPISODE: ${GRAPHITI_MAX_RELATIONSHIPS_PER_EPISODE:-25}
      GRAPHITI_EMBEDDING_DIMENSIONS: ${GRAPHITI_EMBEDDING_DIMENSIONS:-768}
      GRAPHITI_EXTRACTION_FALLBACK_PROVIDER: ${GRAPHITI_EXTRACTION_FALLBACK_PROVIDER:-}
      GRAPHITI_EXTRACTION_FALLBACK_MODEL: ${GRAPHITI_EXTRACTION_FALLBACK_MODEL:-}
      GRAPHITI_EXTRACTION_PRIMARY_ATTEMPTS: ${GRAPHITI_EXTRACTION_PRIMARY_ATTEMPTS:-2}
      GRAPHITI_EXTRACTION_FALLBACK_ATTEMPTS: ${GRAPHITI_EXTRACTION_FALLBACK_ATTEMPTS:-1}
      GRAPHITI_EXTRACTION_MAX_PROVIDER_CALLS: ${GRAPHITI_EXTRACTION_MAX_PROVIDER_CALLS:-${GRAPH_SYNC_MAX_PROVIDER_CALLS:-32}}
      GRAPH_SYNC_PROFILE_FINGERPRINT: ${GRAPH_SYNC_PROFILE_FINGERPRINT:-}
      GRAPH_SYNC_PROMPT_VERSION: ${GRAPH_SYNC_PROMPT_VERSION:-lore-extraction:v1}
      GRAPH_SYNC_SCHEMA_VERSION: ${GRAPH_SYNC_SCHEMA_VERSION:-graphiti-core-output:v1}
      GRAPH_SYNC_LEASE_SECONDS: ${GRAPH_SYNC_LEASE_SECONDS:-900}
      GRAPH_SYNC_MAX_JOB_ATTEMPTS: ${GRAPH_SYNC_MAX_JOB_ATTEMPTS:-3}
      GRAPH_SYNC_RETRY_BASE_SECONDS: ${GRAPH_SYNC_RETRY_BASE_SECONDS:-60}
      GRAPH_SYNC_RETRY_MAX_SECONDS: ${GRAPH_SYNC_RETRY_MAX_SECONDS:-3600}
      GRAPH_SYNC_MAX_PROVIDER_CALLS: ${GRAPH_SYNC_MAX_PROVIDER_CALLS:-32}
      OPENROUTER_GRAPHITI_MODEL: ${OPENROUTER_GRAPHITI_MODEL:-}
      OPENROUTER_GRAPHITI_MAX_OUTPUT_TOKENS: ${OPENROUTER_GRAPHITI_MAX_OUTPUT_TOKENS:-65536}
      OPENROUTER_GRAPHITI_PRIMARY_ATTEMPTS: ${OPENROUTER_GRAPHITI_PRIMARY_ATTEMPTS:-3}
      OPENROUTER_GRAPHITI_MAX_PROVIDER_CALLS: ${OPENROUTER_GRAPHITI_MAX_PROVIDER_CALLS:-16}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE:-}
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Luminari Sage}
      OPENROUTER_REQUEST_TIMEOUT: ${OPENROUTER_REQUEST_TIMEOUT:-600}
      OPENROUTER_TRANSPORT_MAX_ATTEMPTS: ${OPENROUTER_TRANSPORT_MAX_ATTEMPTS:-3}
      OPENROUTER_TRANSPORT_RETRY_ON: ${OPENROUTER_TRANSPORT_RETRY_ON:-transport,rate_limit}
      OPENROUTER_RETRY_BASE_SECONDS: ${OPENROUTER_RETRY_BASE_SECONDS:-0.5}
      OPENROUTER_RETRY_MAX_SECONDS: ${OPENROUTER_RETRY_MAX_SECONDS:-8}
      OPENROUTER_MAX_CONTEXT_TOKENS: ${OPENROUTER_MAX_CONTEXT_TOKENS:-1000000}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-}
      OPENROUTER_CHAT_PROMPT_PROFILE: ${OPENROUTER_CHAT_PROMPT_PROFILE:-}
      OPENROUTER_CHAT_CAPABILITIES: ${OPENROUTER_CHAT_CAPABILITIES:-}
      OPENROUTER_CHAT_CONTEXT_TOKENS: ${OPENROUTER_CHAT_CONTEXT_TOKENS:-}
      OPENROUTER_CHAT_TEMPERATURE: ${OPENROUTER_CHAT_TEMPERATURE:-}
      OPENROUTER_CHAT_REVISION: ${OPENROUTER_CHAT_REVISION:-}
      OPENROUTER_CREATIVE_MODEL: ${OPENROUTER_CREATIVE_MODEL:-}
      OPENROUTER_CREATIVE_PROMPT_PROFILE: ${OPENROUTER_CREATIVE_PROMPT_PROFILE:-}
      OPENROUTER_CREATIVE_CAPABILITIES: ${OPENROUTER_CREATIVE_CAPABILITIES:-}
      OPENROUTER_CREATIVE_CONTEXT_TOKENS: ${OPENROUTER_CREATIVE_CONTEXT_TOKENS:-}
      OPENROUTER_CREATIVE_TEMPERATURE: ${OPENROUTER_CREATIVE_TEMPERATURE:-}
      OPENROUTER_CREATIVE_REVISION: ${OPENROUTER_CREATIVE_REVISION:-}
      OPENROUTER_REASONING_MODEL: ${OPENROUTER_REASONING_MODEL:-}
      OPENROUTER_REASONING_PROMPT_PROFILE: ${OPENROUTER_REASONING_PROMPT_PROFILE:-}
      OPENROUTER_REASONING_CAPABILITIES: ${OPENROUTER_REASONING_CAPABILITIES:-}
      OPENROUTER_REASONING_CONTEXT_TOKENS: ${OPENROUTER_REASONING_CONTEXT_TOKENS:-}
      OPENROUTER_REASONING_TEMPERATURE: ${OPENROUTER_REASONING_TEMPERATURE:-}
      OPENROUTER_REASONING_REVISION: ${OPENROUTER_REASONING_REVISION:-}
      OPENROUTER_EXTRACTION_MODEL: ${OPENROUTER_EXTRACTION_MODEL:-}
      OPENROUTER_EXTRACTION_PROMPT_PROFILE: ${OPENROUTER_EXTRACTION_PROMPT_PROFILE:-}
      OPENROUTER_EXTRACTION_CAPABILITIES: ${OPENROUTER_EXTRACTION_CAPABILITIES:-}
      OPENROUTER_EXTRACTION_CONTEXT_TOKENS: ${OPENROUTER_EXTRACTION_CONTEXT_TOKENS:-}
      OPENROUTER_EXTRACTION_TEMPERATURE: ${OPENROUTER_EXTRACTION_TEMPERATURE:-}
      OPENROUTER_EXTRACTION_REVISION: ${OPENROUTER_EXTRACTION_REVISION:-}
      OPENROUTER_TOOLS_MODEL: ${OPENROUTER_TOOLS_MODEL:-}
      OPENROUTER_TOOLS_PROMPT_PROFILE: ${OPENROUTER_TOOLS_PROMPT_PROFILE:-}
      OPENROUTER_TOOLS_CAPABILITIES: ${OPENROUTER_TOOLS_CAPABILITIES:-}
      OPENROUTER_TOOLS_CONTEXT_TOKENS: ${OPENROUTER_TOOLS_CONTEXT_TOKENS:-}
      OPENROUTER_TOOLS_TEMPERATURE: ${OPENROUTER_TOOLS_TEMPERATURE:-}
      OPENROUTER_TOOLS_REVISION: ${OPENROUTER_TOOLS_REVISION:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
      OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-1024}
      OPENROUTER_EMBEDDING_BATCH_SIZE: ${OPENROUTER_EMBEDDING_BATCH_SIZE:-32}
      OPENROUTER_EMBEDDING_ENCODING_FORMAT: ${OPENROUTER_EMBEDDING_ENCODING_FORMAT:-float}
      OPENROUTER_EMBEDDING_REVISION: ${OPENROUTER_EMBEDDING_REVISION:-}
      OPENROUTER_EMBEDDING_INPUT_TYPE: ${OPENROUTER_EMBEDDING_INPUT_TYPE:-}
      OPENROUTER_TEXT_ALLOW_FALLBACKS: ${OPENROUTER_TEXT_ALLOW_FALLBACKS:-false}
      OPENROUTER_TEXT_REQUIRE_PARAMETERS: ${OPENROUTER_TEXT_REQUIRE_PARAMETERS:-true}
      OPENROUTER_TEXT_DATA_COLLECTION: ${OPENROUTER_TEXT_DATA_COLLECTION:-deny}
      OPENROUTER_TEXT_ZDR: ${OPENROUTER_TEXT_ZDR:-false}
      OPENROUTER_TEXT_PROVIDER_ORDER: ${OPENROUTER_TEXT_PROVIDER_ORDER:-}
      OPENROUTER_TEXT_PROVIDER_ONLY: ${OPENROUTER_TEXT_PROVIDER_ONLY:-}
      OPENROUTER_TEXT_PROVIDER_IGNORE: ${OPENROUTER_TEXT_PROVIDER_IGNORE:-}
      OPENROUTER_EMBEDDING_ALLOW_FALLBACKS: ${OPENROUTER_EMBEDDING_ALLOW_FALLBACKS:-false}
      OPENROUTER_EMBEDDING_REQUIRE_PARAMETERS: ${OPENROUTER_EMBEDDING_REQUIRE_PARAMETERS:-true}
      OPENROUTER_EMBEDDING_DATA_COLLECTION: ${OPENROUTER_EMBEDDING_DATA_COLLECTION:-deny}
      OPENROUTER_EMBEDDING_ZDR: ${OPENROUTER_EMBEDDING_ZDR:-false}
      OPENROUTER_EMBEDDING_PROVIDER_ORDER: ${OPENROUTER_EMBEDDING_PROVIDER_ORDER:-}
      OPENROUTER_EMBEDDING_PROVIDER_ONLY: ${OPENROUTER_EMBEDDING_PROVIDER_ONLY:-}
      OPENROUTER_EMBEDDING_PROVIDER_IGNORE: ${OPENROUTER_EMBEDDING_PROVIDER_IGNORE:-}
      # Embedding Configuration
      USE_LOCAL_EMBEDDINGS: ${USE_LOCAL_EMBEDDINGS:-true}
      # Observability (off unless a LangSmith key is supplied)
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      GRAPHITI_TELEMETRY_ENABLED: ${GRAPHITI_TELEMETRY_ENABLED:-false}
      # Authentication
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,api,luminari-api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SAGE_API_KEY: ${SAGE_API_KEY:-}
      SAGE_MCP_KEY: ${SAGE_MCP_KEY:-}
      SAGE_MCP_BACKEND_KEY: ${SAGE_MCP_BACKEND_KEY:-}
      # OpenAI (required for Graphiti reranker)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8003}:8003"
      # The MCP server also runs in this container (see supervisord.conf); publish it so
      # MCP clients on the host can reach it. Production uses host networking instead.
      - "127.0.0.1:${MCP_PORT:-8004}:8004"
    volumes:
      # Bind-mount application code so the reload-enabled development servers see
      # edits without rebuilding the image.
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./ui:/app/ui:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./Makefile:/app/Makefile:ro
      - ./.gitleaks.toml:/app/.gitleaks.toml:ro
      - ./.env.example:/app/.env.example:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.no-ollama.yml:/app/docker-compose.no-ollama.yml:ro
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
      - ./docker-compose.openai.yml:/app/docker-compose.openai.yml:ro
      - ./docker-compose.openrouter.yml:/app/docker-compose.openrouter.yml:ro
      - ./scripts:/app/scripts:ro
      - ./schemas:/app/schemas:ro
      - ./benchmarks:/app/benchmarks:ro
      # Filesystem-level corpus boundary: drafts/meta/reference files are not
      # visible inside the production API container at all.
      - ./lore_docs/canon:/app/lore_docs/canon:ro
      # A named volume inherits the image's non-root ownership. A host bind mount
      # would be owned by the developer's UID and block the UID 1013 app process.
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - luminari-network
    restart: "no"

  # Static developer chat UI
  ui:
    image: python:3.13-slim-bookworm
    container_name: luminari-ui
    command: ["python", "/app/ui/serve.py", "8080", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    volumes:
      - ./ui:/app/ui:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/chat-ui.html', timeout=5).read(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminari-network
    restart: "no"

networks:
  luminari-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  ollama_models:
    driver: local
  api_logs:
    driver: local
