[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
# pytest-asyncio >=1.0 configures mode via ini options, not addopts
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: Integration tests requiring running services
    data_dependent: Tests requiring loaded test data
    slow: Slow running tests
    unit: Fast unit tests
    e2e: End-to-end workflow tests
    quality: Quality comparison tests
    performance: Performance benchmark tests
    stress: Stress and stability tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
