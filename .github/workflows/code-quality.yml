name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint, Type Check, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      PYTHONHASHSEED: "0"
      SAGE_API_KEY: test-only-sage-api-key
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-core.txt \
            -r requirements-dev.txt \
            ruff==0.16.0

      - name: Verify formatting
        run: |
          python -m black --check .
          python -m isort --check-only .

      - name: Run lint and type checks
        run: |
          ruff check .
          python -m mypy src/
          python -m compileall -q src

      - name: Run deterministic test suite
        run: |
          python -m pytest \
            -m "not integration and not data_dependent and not e2e and not quality and not performance and not stress and not slow" \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-quality-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
