name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run bi-weekly on the 1st and 15th.
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/${archive}" |
            sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin-gitleaks"

      - name: Scan repository and full Git history
        run: |
          "${RUNNER_TEMP}/bin-gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --max-decode-depth=5 \
            --redact=100 \
            --report-format=json \
            --report-path=gitleaks-report.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  dependency-scan:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Scan dependency manifests
        run: |
          set +e
          pip-audit -r requirements.txt --desc --format json --output audit-report.json
          full_status=$?
          pip-audit -r requirements-core.txt --desc --format json --output audit-core-report.json
          core_status=$?
          # The official CPU wheel resolves as "torch X.Y.Z+cpu", which the
          # PyPI audit service cannot identify. Audit its matching public
          # version explicitly so that the local-version suffix is not a blind
          # spot in the dependency gate.
          printf '%s\n' 'torch==2.13.0' > "${RUNNER_TEMP}/torch-audit.txt"
          pip-audit --no-deps \
            -r "${RUNNER_TEMP}/torch-audit.txt" \
            --desc \
            --format json \
            --output audit-torch-report.json
          torch_status=$?
          set -e

          if (( full_status != 0 || core_status != 0 || torch_status != 0 )); then
            echo "Dependency vulnerabilities detected; see uploaded reports."
            exit 1
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit-reports
          path: |
            audit-report.json
            audit-core-report.json
            audit-torch-report.json
          if-no-files-found: ignore

  code-security:
    name: Python Security Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check "bandit[toml]==1.9.4"

      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          # Enforce medium-or-higher severity at medium-or-higher confidence.
          bandit -r src/ --severity-level medium --confidence-level medium

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --pull -t luminari-sage:security-scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luminari-sage:security-scan
          format: table
          output: trivy-results.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report
          path: trivy-results.txt
          if-no-files-found: ignore

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, dependency-scan, code-security, docker-security]
    if: always()
    steps:
      - name: Generate summary
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
          CODE_RESULT: ${{ needs.code-security.result }}
          DOCKER_RESULT: ${{ needs.docker-security.result }}
        run: |
          result_line() {
            local label="$1"
            local result="$2"
            local marker="❌"
            if [[ "$result" == "success" ]]; then
              marker="✅"
            fi
            printf -- '- %s %s: %s\n' "$marker" "$label" "$result"
          }

          {
            echo "# Security Scan Summary"
            echo
            result_line "Gitleaks" "$GITLEAKS_RESULT"
            result_line "Dependency scan" "$DEPENDENCY_RESULT"
            result_line "Python security lint" "$CODE_RESULT"
            result_line "Docker security" "$DOCKER_RESULT"
            echo
            echo "Detailed reports are attached as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
