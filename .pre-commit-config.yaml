# Pre-commit hooks for Luminari Sage
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Gitleaks - Scan for secrets and credentials
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks - Scan for secrets
        entry: gitleaks git --staged --config .gitleaks.toml --verbose --redact=100
        language: system
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ["--unsafe"] # Allow custom tags in docker-compose
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1000"]
      - id: detect-private-key
        name: Detect private keys
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: mixed-line-ending
        name: Check for mixed line endings

  # Python-specific hooks
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e # 26.5.1
    hooks:
      - id: black
        name: Format Python code with Black
        # Any python3 works; the formatting target is pinned via pyproject.toml
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a # 8.0.1
    hooks:
      - id: isort
        name: Sort Python imports
        # profile/line_length come from pyproject.toml

  # Ruff replaces flake8 here: it implements the same pycodestyle/pyflakes checks and reads
  # its config from pyproject.toml, so lint rules live in exactly one place. Running both
  # meant flake8 reported E501/E402 that ruff is deliberately configured to allow.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
    hooks:
      - id: ruff
        name: Lint Python code with Ruff

  # Markdown and documentation
  # pre-commit/mirrors-prettier is archived; rbubley/mirrors-prettier is the maintained fork
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 0ee178619d696787ca73d210cc191d720868c631 # v3.9.6
    hooks:
      - id: prettier
        name: Format markdown and YAML
        types_or: [markdown, yaml]
        exclude: '^(\.github/|schemas/)'

# Configuration for specific file patterns.
# NOTE: no trailing `$` — these are path *prefixes*. With `)$` the pattern only matched
# paths ending at the directory name, so nothing inside lore_docs/ was ever excluded and
# prettier rewrote the canonical lore documents.
exclude: |
  (?x)^(
      \.venv/|
      venv/|
      __pycache__/|
      \.pytest_cache/|
      logs/|
      .*_data/|
      backups/|
      \.env\.example|
      lore_docs/
  )
